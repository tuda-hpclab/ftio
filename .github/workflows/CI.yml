name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - 'main'
      - 'development'
  workflow_dispatch:

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  # ============================================
  # Code Quality: Linting and Formatting
  # ============================================
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    continue-on-error: true  # Non-blocking

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Run Ruff linter
        run: ruff check . --output-format=github

      - name: Check code formatting with Black
        run: black --check --diff .

  # ============================================
  # Tests: Multi-Python Version Matrix
  # ============================================
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: [lint]

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      # The darshan wheel lags new Python releases (there is none for 3.13/3.14),
      # which is why darshan is an opt-in extra rather than a core dependency. Ask
      # pip whether it can resolve one for THIS interpreter, so the matrix still
      # covers the Darshan path wherever it is installable instead of dropping it
      # everywhere.
      - name: Check whether darshan is installable on this Python
        id: darshan
        run: |
          if pip install --dry-run darshan >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "darshan wheel resolves for Python ${{ matrix.python-version }}"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "no darshan wheel for Python ${{ matrix.python-version }} -- installing without it"
          fi

      # Uncomment to test the Darshan path on 3.13/3.14 too: darshan-util from
      # source gives the C library, which is what the pip package lacks a wheel for.
      # - name: Install System Darshan-util (Python 3.13+)
      #   if: matrix.python-version == '3.13' || matrix.python-version == '3.14'
      #   run: |
      #     wget https://github.com/darshan-hpc/darshan/archive/refs/tags/3.4.4.tar.gz -O darshan.tar.gz
      #     tar -xzf darshan.tar.gz
      #     cd darshan-3.4.4/darshan-util
      #     ./configure --prefix=/usr
      #     make -j$(nproc)
      #     sudo make install
      #     sudo ldconfig

      - name: Install dependencies
        env:
          DARSHAN_AVAILABLE: ${{ steps.darshan.outputs.available }}
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ "$DARSHAN_AVAILABLE" = "true" ]; then
            EXTRAS="external-libs,darshan-libs"
          else
            EXTRAS="external-libs"
          fi
          echo "Installing FTIO with extras: $EXTRAS"
          pip install --upgrade ".[$EXTRAS]" || pip install --upgrade . --no-cache-dir

      - name: Run tests
        run: |
          cd test
          pytest --junitxml=test-results.xml -v

      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results (Python ${{ matrix.python-version }})
          path: test/test-results.xml
          reporter: java-junit

  # ============================================
  # Coverage Report (Primary Python Version)
  # ============================================
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.11-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.11-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install --upgrade .[external-libs] || pip install --upgrade . --no-cache-dir

      - name: Run tests with coverage
        run: |
          cd test
          pytest --cov=ftio --cov-report=term -v

      - name: Write coverage to job summary
        run: |
          cd test
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

  # ============================================
  # Build Verification
  # ============================================
  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package with twine
        run: twine check dist/*

  # ============================================
  # Full Test: FTIO with all optional dependencies
  # ============================================
  test-full:
    name: Full Test (Optional Dependencies)
    runs-on: ubuntu-latest
    needs: [test, coverage]
    if: |
      github.event_name == 'workflow_dispatch' || 
      contains(fromJSON('["main", "development"]'), github.ref_name) || 
      contains(fromJSON('["main", "development"]'), github.base_ref)
    continue-on-error: true  # Non-blocking

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          # Use Makefile target to install everything
          make ftio_full PYTHON=python

      - name: Run tests
        run: |
          cd test
          pytest --junitxml=test-full-results.xml -v

      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Full Test Results
          path: test/test-full-results.xml
          reporter: java-junit
